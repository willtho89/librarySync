[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "librarysync-worker"
version = "0.7.0"
description = "librarySync worker"
requires-python = ">=3.14"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "greenlet>=3.0",
  "parsett",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["librarysync*", "librarysync_worker*"]

[tool.uv]
dev-dependencies = ["ruff>=0.5.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
