x-worker-base: &worker-base
  build:
    context: .
    dockerfile: worker/Dockerfile
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    api:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "python -c \"import urllib.request,sys; urllib.request.urlopen('http://api:8000/health', timeout=2); sys.exit(0)\"",
      ]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librarysync}
      POSTGRES_USER: ${POSTGRES_USER:-librarysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librarysync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-librarysync} -d ${POSTGRES_DB:-librarysync}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); sys.exit(0)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *worker-base
    environment:
      LIBRARYSYNC_WORKER_MODES: ${LIBRARYSYNC_WORKER_MODES:-all}

  worker-outbox:
    <<: *worker-base
    profiles: ["scaled-workers"]
    environment:
      LIBRARYSYNC_WORKER_MODES: outbox

  worker-metadata:
    <<: *worker-base
    profiles: ["scaled-workers"]
    environment:
      LIBRARYSYNC_WORKER_MODES: metadata

  worker-imports:
    <<: *worker-base
    profiles: ["scaled-workers"]
    environment:
      LIBRARYSYNC_WORKER_MODES: imports

  worker-import-all:
    <<: *worker-base
    profiles: ["scaled-workers"]
    environment:
      LIBRARYSYNC_WORKER_MODES: import_all

  worker-merge:
    <<: *worker-base
    profiles: ["scaled-workers"]
    environment:
      LIBRARYSYNC_WORKER_MODES: merge

volumes:
  pgdata:
