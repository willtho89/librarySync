x-app-base: &app-base
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: librarysync:local

services:
  api:
    <<: *app-base

  worker:
    <<: *app-base

  worker-outbox:
    <<: *app-base

  worker-metadata:
    <<: *app-base

  worker-import-quick:
    <<: *app-base

  worker-import-all:
    <<: *app-base

  worker-watchlist:
    <<: *app-base

  worker-metadata-cache:
    <<: *app-base

  worker-metadata-backfill:
    <<: *app-base

  worker-history-merge:
    <<: *app-base
