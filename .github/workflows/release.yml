name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "SemVer bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            base=$(python -c 'import re, pathlib, sys; text=pathlib.Path("backend/pyproject.toml").read_text(); m=re.search(r"(?m)^version = \\"([^\\"]+)\\"", text); (m or sys.exit("version not found in backend/pyproject.toml")); print(m.group(1))')
          else
            base="${latest_tag#v}"
          fi
          IFS=. read -r major minor patch <<<"$base"
          case "$RELEASE_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          next="${major}.${minor}.${patch}"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Update versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -c 'import os, re, pathlib, sys; version=os.environ["VERSION"]; paths=[pathlib.Path("backend/pyproject.toml"), pathlib.Path("worker/pyproject.toml")]; for path in paths: text=path.read_text(); updated, count=re.subn(r"(?m)^version = \\"([^\\"]+)\\"", f"version = \\"{version}\\"", text, count=1); (count == 1) or sys.exit(f"version not found in {path}"); path.write_text(updated)'

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add backend/pyproject.toml worker/pyproject.toml
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
