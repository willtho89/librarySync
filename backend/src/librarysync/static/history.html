<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History - librarySync</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body data-requires-auth="true">
    <header class="site-header">
      <h1>Watched History</h1>
      <nav>
        <a href="/" data-auth-only>Home</a>
        <a href="/static/add-watched.html" data-auth-only>Add Watched</a>
        <a href="/static/integrations.html" data-auth-only>Integrations</a>
        <a href="/static/activity.html" data-auth-only>Activity</a>
        <a href="/static/settings.html" data-auth-only>Settings</a>
        <button type="button" data-logout data-auth-only>Log out</button>
      </nav>
    </header>
    <main>
      <section class="card">
        <h2>Watched items</h2>
        <div class="button-row history-bulk-actions">
          <label class="inline-label">
            <span>Select all</span>
            <input id="history-select-all" type="checkbox" />
          </label>
          <label class="inline-label">
            <span>Also delete from integrations</span>
            <input id="history-delete-integrations" type="checkbox" />
          </label>
          <button
            id="history-delete-selected"
            type="button"
            class="danger-button"
            disabled
          >
            Delete selected
          </button>
        </div>
        <div id="history-sync-actions" class="button-row" hidden></div>
        <p id="history-sync-note" class="helper-text" hidden>
          Select items to sync just those, or sync everything if nothing is selected.
        </p>
        <div class="button-row">
          <button id="history-clear" type="button" class="danger-button">
            Clear history
          </button>
        </div>
        <p class="helper-text">
          This permanently removes all watched items from your history.
        </p>
        <p id="history-message" class="form-message" hidden></p>
        <div id="history-list" class="candidate-list">Loading...</div>
      </section>
    </main>
    <div id="metadata-modal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="metadata-title"
      >
        <header class="modal-header">
          <h2 id="metadata-title">Item metadata</h2>
          <button type="button" class="secondary-button" data-modal-close>
            Close
          </button>
        </header>
        <div id="metadata-body" class="modal-body"></div>
      </div>
    </div>
  </body>
</html>
