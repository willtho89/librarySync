<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Integrations - librarySync</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body data-requires-auth="true">
    <header class="site-header">
      <h1>Integrations</h1>
      <nav>
        <a href="/" data-auth-only>Home</a>
        <a href="/static/add-watched.html" data-auth-only>Add Watched</a>
        <a href="/static/history.html" data-auth-only>History</a>
        <a href="/static/activity.html" data-auth-only>Activity</a>
        <a href="/static/settings.html" data-auth-only>Settings</a>
        <button type="button" data-logout data-auth-only>Log out</button>
      </nav>
    </header>
    <main>
      <section class="card">
        <h2>AIOStreams</h2>
        <form id="aiostreams-form">
          <label>
            Base URL
            <input type="url" name="base_url" placeholder="https://..." required />
          </label>
          <label>
            API Key (optional)
            <input type="text" name="api_key" />
          </label>
          <button type="submit">Save</button>
          <p id="aiostreams-message" class="form-message" role="status" hidden></p>
        </form>
      </section>
      <section class="card">
        <h2>Letterboxd</h2>
        <form id="letterboxd-form">
          <label>
            Paste curl/httpie command
            <textarea
              name="command"
              id="letterboxd-command"
              rows="6"
              placeholder="curl -H 'Cookie: ...' -d 'client_id=...&client_secret=...&refresh_token=...' https://api.letterboxd.com/api/v0/oauth/token"
            ></textarea>
          </label>
          <button type="button" id="letterboxd-parse">Parse Command</button>
          <label>
            API Base URL
            <input
              type="url"
              name="api_base_url"
              placeholder="https://api.letterboxd.com/api/v0"
            />
          </label>
          <label>
            Client ID
            <input type="text" name="client_id" autocomplete="off" />
          </label>
          <label>
            Client Secret
            <input type="password" name="client_secret" autocomplete="off" />
          </label>
          <label>
            Refresh Token
            <input type="password" name="refresh_token" autocomplete="off" />
          </label>
          <label>
            Cookies (JSON)
            <textarea
              name="cookies"
              rows="6"
              placeholder='{"letterboxd.signed.in.as":"..."}'
            ></textarea>
          </label>
          <p class="helper-text">
            Paste a JSON object of cookie names to values from your captured session.
          </p>
          <button type="submit">Save</button>
          <button type="button" id="letterboxd-test">Test</button>
          <p id="letterboxd-message" class="form-message" role="status" hidden></p>
        </form>
        <h3>History import</h3>
        <form id="letterboxd-import-form">
          <label>
            Import schedule
            <select name="import_interval">
              <option value="">Manual only</option>
              <option value="21600">Every 6 hours</option>
              <option value="43200">Every 12 hours</option>
              <option value="86400">Every day</option>
              <option value="259200">Every 3 days</option>
              <option value="604800">Every 7 days</option>
            </select>
          </label>
          <div class="button-row">
            <button type="submit">Save schedule</button>
            <button type="button" id="letterboxd-import-now" class="secondary-button">
              Import now
            </button>
          </div>
          <p id="letterboxd-import-last" class="helper-text"></p>
          <p
            id="letterboxd-import-message"
            class="form-message"
            role="status"
            hidden
          ></p>
        </form>
      </section>
      <section class="card">
        <h2>Trakt</h2>
        <p id="trakt-message" class="form-message" role="status" hidden></p>
        <div class="button-row">
          <button type="button" id="trakt-connect">Connect Trakt</button>
          <button type="button" id="trakt-disconnect" class="secondary-button" hidden>
            Disconnect
          </button>
        </div>
        <h3>History import</h3>
        <form id="trakt-import-form">
          <label>
            Import schedule
            <select name="import_interval">
              <option value="">Manual only</option>
              <option value="21600">Every 6 hours</option>
              <option value="43200">Every 12 hours</option>
              <option value="86400">Every day</option>
              <option value="259200">Every 3 days</option>
              <option value="604800">Every 7 days</option>
            </select>
          </label>
          <div class="button-row">
            <button type="submit">Save schedule</button>
            <button type="button" id="trakt-import-now" class="secondary-button">
              Import now
            </button>
          </div>
          <p id="trakt-import-last" class="helper-text"></p>
          <p id="trakt-import-message" class="form-message" role="status" hidden></p>
        </form>
      </section>
      <section class="card">
        <h2>SIMKL</h2>
        <p id="simkl-message" class="form-message" role="status" hidden></p>
        <div class="button-row">
          <button type="button" id="simkl-connect">Connect SIMKL</button>
          <button type="button" id="simkl-disconnect" class="secondary-button" hidden>
            Disconnect
          </button>
        </div>
        <h3>History import</h3>
        <form id="simkl-import-form">
          <label>
            Import schedule
            <select name="import_interval">
              <option value="">Manual only</option>
              <option value="21600">Every 6 hours</option>
              <option value="43200">Every 12 hours</option>
              <option value="86400">Every day</option>
              <option value="259200">Every 3 days</option>
              <option value="604800">Every 7 days</option>
            </select>
          </label>
          <div class="button-row">
            <button type="submit">Save schedule</button>
            <button type="button" id="simkl-import-now" class="secondary-button">
              Import now
            </button>
          </div>
          <p id="simkl-import-last" class="helper-text"></p>
          <p id="simkl-import-message" class="form-message" role="status" hidden></p>
        </form>
      </section>
    </main>
  </body>
</html>
