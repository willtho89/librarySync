<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - librarySync</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="lIbrarySync" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body data-guest-only="true">
    <header class="site-header">
      <h1 class="site-title">
        <img class="site-logo" src="/favicon.svg" alt="" />
        <span>librarySync</span>
      </h1>
      <nav>
        <a href="/">Home</a>
        <a href="/static/login.html" data-guest-only>Login</a>
        <a href="/static/add-watched.html" data-auth-only>Add Watched</a>
        <a href="/static/history.html" data-auth-only>History</a>
        <a href="/static/integrations.html" data-auth-only>Integrations</a>
        <a href="/static/activity.html" data-auth-only>Activity</a>
        <a href="/static/settings.html" data-auth-only>Settings</a>
        <span class="nav-user" data-auth-only>
          Signed in as <strong data-user-username></strong>
        </span>
        <button type="button" data-logout data-auth-only>Log out</button>
      </nav>
    </header>
    <main>
      <section class="card">
        <h2>Login</h2>
        <form id="login-form">
          <label>
            Username
            <input type="text" name="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Sign in</button>
          <p id="login-message" class="form-message" role="status" hidden></p>
        </form>
      </section>
      <section class="card">
        <h2>Create an account</h2>
        <form id="register-form">
          <label>
            Username
            <input type="text" name="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Register</button>
          <p id="register-message" class="form-message" role="status" hidden></p>
        </form>
      </section>
    </main>
  </body>
</html>
