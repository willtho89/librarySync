{% extends "base.html" %}

{% block content %}
<section class="space-y-6">
  <div class="history-toolbar-group">
    <div class="history-search-bar">
      <label class="field history-search-field">
        <span>Search</span>
        <input
          id="watchlist-search"
          class="input"
          type="search"
          placeholder="Title, ID, or year"
        />
      </label>
    </div>
    <div class="card history-toolbar">
      <div class="flex flex-col gap-4 md:flex-row md:items-end">
        <div class="history-toolbar-row flex-1">
          <label class="field min-w-[160px]">
            <span>Status</span>
            <select id="watchlist-status-filter" class="select">
              <option value="all" selected>All</option>
              <option value="added">Added</option>
              <option value="in_progress">In progress</option>
              <option value="watched">Watched</option>
              <option value="not_released">Not released yet</option>
            </select>
          </label>
          <label class="field min-w-[160px]">
             <span>Source</span>
             <select id="watchlist-source-filter" class="select">
               <option value="all">All sources</option>
               <option value="manual">Manual</option>
               <option value="trakt">Trakt</option>
               <option value="simkl">SIMKL</option>
               <option value="letterboxd">Letterboxd</option>
             </select>
          </label>
          <label class="field min-w-[160px]">
            <span>Watched items</span>
            <select id="watchlist-watched-display" class="select">
              <option value="hide">Hide</option>
              <option value="overlay" selected>Overlay</option>
              <option value="show">Show</option>
            </select>
          </label>
          <label class="field min-w-[160px]">
            <span>Type</span>
            <select id="watchlist-type-filter" class="select">
              <option value="all">All types</option>
              <option value="movie">Movies</option>
              <option value="tv">TV</option>
              <option value="anime">Anime</option>
            </select>
          </label>
          <label class="field min-w-[120px]">
            <span>Per page</span>
            <select id="watchlist-page-size" class="select">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
        <button id="watchlist-filters-clear" type="button" class="btn btn-secondary btn-sm whitespace-nowrap">
          Clear filters
        </button>
      </div>
    </div>
  </div>

  <div class="card mb-24">
    <div class="card-header">
      <div>
        <h2 class="section-title">Watchlist</h2>
        <p class="section-subtitle">Track what you want to watch.</p>
      </div>
    </div>
    <div id="watchlist-list" class="candidate-list">Loading...</div>
  </div>
</section>

<div class="sticky-footer">
  <div class="flex items-center justify-between gap-4">
     <div class="hidden sm:block">
        <!-- Optional stats -->
     </div>
     <div class="flex flex-1 items-center justify-between gap-3 sm:flex-none sm:justify-start">
          <button id="watchlist-page-prev" type="button" class="btn btn-ghost btn-sm">
            Previous
          </button>
          <span id="watchlist-page-info" class="text-xs font-medium text-ink">Loading...</span>
          <button id="watchlist-page-next" type="button" class="btn btn-ghost btn-sm">
            Next
          </button>
     </div>
  </div>
</div>

<div id="watchlist-bulk-bar" class="history-bulk-bar" data-bulk-bar>
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-4 px-4 py-3">
    <label class="inline-control">
      <input id="watchlist-select-all" type="checkbox" />
      <span>Select all</span>
    </label>
    <button id="watchlist-delete-selected" type="button" class="btn btn-danger btn-sm" disabled>
      Remove selected
    </button>
  </div>
</div>

<div id="metadata-modal" class="metadata-drawer" hidden>
  <div class="metadata-backdrop" data-modal-close></div>
  <div class="metadata-panel" role="dialog" aria-modal="true" aria-labelledby="metadata-title">
    <header class="metadata-header">
      <h2 id="metadata-title" class="section-title" data-modal-title>Item metadata</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-modal-close>Close</button>
    </header>
    <div id="metadata-body" class="metadata-body" data-modal-body></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <script src="{{ static_url('/static/watch-utils.js') }}" defer></script>
  <script src="{{ static_url('/static/page-watchlist.js') }}" defer></script>
{% endblock %}
