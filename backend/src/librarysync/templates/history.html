{% extends "base.html" %}

{% block content %}
<section class="space-y-6">
  <div class="history-toolbar-group">
    <div class="history-search-bar">
      <label class="field history-search-field">
        <span>Search</span>
        <input
          id="history-search"
          class="input"
          type="search"
          placeholder="Title, ID, or year"
        />
      </label>
    </div>
    <div class="card history-toolbar">
      <div class="flex flex-col gap-4 md:flex-row md:items-end">
        <div class="history-toolbar-row flex-1">
          <label class="field min-w-[160px]">
            <span>Type</span>
            <select id="history-type-filter" class="select">
              <option value="all">All types</option>
              <option value="movie">Movies</option>
              <option value="tv">TV</option>
              <option value="anime">Anime</option>
            </select>
          </label>
          <label class="field min-w-[160px]">
            <span>Source</span>
            <select id="history-source-filter" class="select">
              <option value="all">All sources</option>
              <option value="manual">Manual</option>
              <option value="trakt">Trakt</option>
              <option value="simkl">SIMKL</option>
              <option value="letterboxd">Letterboxd</option>
              <option value="stremio">Stremio</option>
              <option value="aiostreams">AIOStreams</option>
            </select>
          </label>
          <label class="field min-w-[120px]">
            <span>Per page</span>
            <select id="history-page-size" class="select">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
        <button id="history-filters-clear" type="button" class="btn btn-secondary btn-sm whitespace-nowrap">
          Clear filters
        </button>
      </div>
    </div>
  </div>

  <div class="card mb-24">
    <div class="card-header">
      <div>
        <h2 class="section-title">Watched items</h2>
        <p class="section-subtitle">Edit, sync, or remove entries.</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <div id="history-sync-actions" class="button-row" hidden></div>
      <label id="history-sync-all-wrap" class="inline-control" hidden>
        <input id="history-sync-all" type="checkbox" />
        <span>Sync entire history</span>
      </label>
    </div>
    <p id="history-sync-note" class="helper-text" hidden>
      Select items to sync just those. Otherwise, syncs the current page.
    </p>
    <p id="history-message" class="form-message" hidden></p>
    <div id="history-list" class="candidate-list">Loading...</div>
  </div>
</section>

<div class="sticky-footer">
  <div class="flex items-center justify-between gap-4">
     <div class="hidden sm:block">
        <!-- Optional: Total count or other info could go here -->
     </div>
     <div class="flex flex-1 items-center justify-between gap-3 sm:flex-none sm:justify-start">
          <button id="history-page-prev" type="button" class="btn btn-ghost btn-sm">
            Previous
          </button>
          <span id="history-page-info" class="text-xs font-medium text-ink">Loading...</span>
          <button id="history-page-next" type="button" class="btn btn-ghost btn-sm">
            Next
          </button>
     </div>
  </div>
</div>

<div id="history-bulk-bar" class="history-bulk-bar" data-bulk-bar>
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-4 px-4 py-3">
    <label class="inline-control">
      <input id="history-select-all" type="checkbox" />
      <span>Select all</span>
    </label>
    <label class="inline-control">
      <input id="history-delete-integrations" type="checkbox" />
      <span>Also delete from integrations</span>
    </label>
    <button id="history-delete-selected" type="button" class="btn btn-danger btn-sm" disabled>
      Delete selected
    </button>
  </div>
</div>

<div id="metadata-modal" class="metadata-drawer" hidden>
  <div class="metadata-backdrop" data-modal-close></div>
  <div class="metadata-panel" role="dialog" aria-modal="true" aria-labelledby="metadata-title">
    <header class="metadata-header">
      <h2 id="metadata-title" class="section-title" data-modal-title>Item metadata</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-modal-close>Close</button>
    </header>
    <div id="metadata-body" class="metadata-body" data-modal-body></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <script src="{{ static_url('/static/watch-utils.js') }}" defer></script>
  <script src="{{ static_url('/static/integrations-utils.js') }}" defer></script>
  <script src="{{ static_url('/static/page-history.js') }}" defer></script>
{% endblock %}
