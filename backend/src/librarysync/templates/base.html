<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }} - librarySync</title>
    <meta name="description" content="librarySync keeps your watch history and ratings aligned across providers." />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="librarySync" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1b24" media="(prefers-color-scheme: dark)" />
    <style>
      [data-auth-state="auth"] [data-guest-only],
      [data-auth-state="guest"] [data-auth-only] {
        display: none !important;
      }
    </style>
    <link
      rel="preload"
      href="/static/fonts/SpaceGrotesk-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/static/fonts/SpaceGrotesk-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/static/fonts/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/static/fonts/IBMPlexSans-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{ static_url('/static/styles.css') }}"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="{{ static_url('/static/styles.css') }}" /></noscript>
    <script src="{{ static_url('/static/app.js') }}" defer></script>
  </head>
  <body
    class="min-h-full bg-base text-ink antialiased"
    data-auth-state="{{ auth_state }}"
    {% if requires_auth %}data-requires-auth="true"{% endif %}
    {% if guest_only %}data-guest-only="true"{% endif %}
  >
    <div class="flex min-h-screen flex-col">
      <header class="sticky top-0 z-40 border-b border-line/60 bg-surface/90 backdrop-blur">
        <div
          class="mx-auto flex w-full max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4"
        >
          <a href="/" class="flex items-center gap-3">
            <img class="h-10 w-10" src="/favicon.svg" alt="" />
            <div class="leading-none">
              <span class="block font-display text-lg tracking-tight">librarySync</span>
              <span class="block text-xs uppercase tracking-[0.3em] text-muted">Sync Hub</span>
            </div>
          </a>
          <!-- Desktop Navigation - Hidden on mobile -->
          <nav class="hidden items-center gap-2 text-sm lg:flex">
            <a
              href="/"
              class="nav-link{% if active_page == 'home' %} nav-link-active{% endif %}"
            >
              Home
            </a>
            <a
              href="/login"
              data-guest-only
              class="nav-link{% if active_page == 'login' %} nav-link-active{% endif %}"
            >
              Login
            </a>
            <a
              href="/add-watched"
              data-auth-only
              class="nav-link{% if active_page == 'add-watched' %} nav-link-active{% endif %}"
            >
              Add Watched
            </a>
            <a
              href="/history"
              data-auth-only
              class="nav-link{% if active_page == 'history' %} nav-link-active{% endif %}"
            >
              History
            </a>
            <a
              href="/activity"
              data-auth-only
              class="nav-link{% if active_page == 'activity' %} nav-link-active{% endif %}"
            >
              Activity
            </a>
            <a
              href="/settings"
              data-auth-only
              class="nav-link{% if active_page == 'settings' or active_page == 'integrations' %} nav-link-active{% endif %}"
            >
              Settings
            </a>
          </nav>
          <!-- Burger Menu Button - Visible on mobile only -->
          <button
            type="button"
            class="flex flex-col gap-1 lg:hidden"
            data-mobile-menu-toggle
            aria-label="Toggle menu"
            aria-expanded="false"
          >
            <span class="h-0.5 w-6 bg-ink transition-transform"></span>
            <span class="h-0.5 w-6 bg-ink transition-opacity"></span>
            <span class="h-0.5 w-6 bg-ink transition-transform"></span>
          </button>
          <div class="flex items-center gap-2">
            <button type="button" class="btn btn-ghost" data-theme-toggle>
              <span class="sr-only">Toggle theme</span>
              <span data-theme-label>System</span>
            </button>
            <button type="button" class="btn btn-ghost" data-logout data-auth-only>
              Log out
            </button>
          </div>
        </div>
      </header>
      <!-- Mobile Menu Overlay -->
      <div
        class="fixed inset-0 z-50 hidden bg-slate/70 backdrop-blur-sm"
        data-mobile-menu-backdrop
      ></div>
      <!-- Mobile Menu Panel -->
      <nav
        class="fixed right-0 top-0 z-50 flex h-full w-64 translate-x-full flex-col gap-2 border-l border-line/60 bg-surface p-6 shadow-card transition-transform duration-300"
        data-mobile-menu-panel
      >
        <div class="mb-4 flex items-center justify-between">
          <span class="text-lg font-display">Menu</span>
          <button
            type="button"
            class="flex h-8 w-8 items-center justify-center rounded-lg border border-line/60 text-muted hover:text-ink"
            data-mobile-menu-close
            aria-label="Close menu"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <a
          href="/"
          class="mobile-nav-link{% if active_page == 'home' %} mobile-nav-link-active{% endif %}"
        >
          Home
        </a>
        <a
          href="/login"
          data-guest-only
          class="mobile-nav-link{% if active_page == 'login' %} mobile-nav-link-active{% endif %}"
        >
          Login
        </a>
        <a
          href="/add-watched"
          data-auth-only
          class="mobile-nav-link{% if active_page == 'add-watched' %} mobile-nav-link-active{% endif %}"
        >
          Add Watched
        </a>
        <a
          href="/history"
          data-auth-only
          class="mobile-nav-link{% if active_page == 'history' %} mobile-nav-link-active{% endif %}"
        >
          History
        </a>
        <a
          href="/activity"
          data-auth-only
          class="mobile-nav-link{% if active_page == 'activity' %} mobile-nav-link-active{% endif %}"
        >
          Activity
        </a>
        <a
          href="/settings"
          data-auth-only
          class="mobile-nav-link{% if active_page == 'settings' or active_page == 'integrations' %} mobile-nav-link-active{% endif %}"
        >
          Settings
        </a>
        <div class="mt-auto border-t border-line/60 pt-4">
          <div class="flex flex-col gap-2">
            <button type="button" class="btn btn-ghost w-full justify-start" data-theme-toggle>
              <span data-theme-label>System</span>
            </button>
            <button type="button" class="btn btn-ghost w-full justify-start" data-logout data-auth-only>
              Log out
            </button>
          </div>
        </div>
      </nav>
      <main class="flex-1">
        <div class="mx-auto w-full max-w-6xl px-4 pb-20 pt-8">
          {% block content %}{% endblock %}
        </div>
      </main>
      <footer class="border-t border-line/60 bg-surface/70">
        <div class="mx-auto flex w-full max-w-6xl flex-col gap-2 px-4 py-6 text-xs text-muted">
          <span>librarySync is a self-hosted sync hub for watch history and ratings.</span>
          <span class="flex flex-wrap items-center gap-3">
            <a class="link-muted" href="https://github.com/willtho89/librarySync">GitHub</a>
            <span>Version {{ app_version }}</span>
          </span>
        </div>
      </footer>
    </div>
  </body>
</html>
