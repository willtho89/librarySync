{% extends "base.html" %}

{% block content %}
<section class="card hero-card">
  <p class="eyebrow">Offline mode</p>
  <h1 class="mt-3 text-3xl font-display tracking-tight sm:text-4xl">
    You're offline. We'll reconnect soon.
  </h1>
  <p class="mt-4 text-muted">
    librarySync cached core pages, but live status and history need a network connection.
    Check your connection and try again.
  </p>
  <div class="mt-6 flex flex-wrap gap-3">
    <a class="btn btn-primary" href="/">Return home</a>
    <button class="btn btn-ghost" type="button" onclick="window.location.reload()">
      Retry
    </button>
  </div>
{% endblock %}
