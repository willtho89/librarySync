{% extends "base.html" %}

{% block content %}
<section class="space-y-6">
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="section-title">Run schedule</h2>
        <p class="section-subtitle">Queue status, imports, and maintenance jobs.</p>
      </div>
      <button id="activity-refresh" type="button" class="btn btn-secondary btn-sm">
        Refresh
      </button>
    </div>
    <p id="activity-message" class="form-message" hidden></p>
    <div id="activity-summary" class="activity-summary">Loading...</div>
    <div id="activity-schedule" class="schedule-list">Loading...</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="section-title">Sync activity</h2>
        <p class="section-subtitle">Filter outbox jobs by status or provider.</p>
      </div>
    </div>
    <div class="grid gap-3 md:grid-cols-3">
      <input
        id="activity-search"
        class="input"
        type="search"
        placeholder="Search title or ID"
      />
      <select id="activity-status-filter" class="select">
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In progress</option>
        <option value="succeeded">Succeeded</option>
        <option value="failed_retryable">Retrying</option>
        <option value="failed_permanent">Failed</option>
      </select>
      <select id="activity-provider-filter" class="select">
        <option value="all">All providers</option>
      </select>
    </div>
    <div id="sync-activity" class="activity-list">Loading...</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="section-title">Recent events</h2>
        <p class="section-subtitle">Audit log of imports and updates.</p>
      </div>
    </div>
    <div id="events" class="activity-list">Loading...</div>
  </div>
</section>
{% endblock %}
