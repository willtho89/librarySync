[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "librarysync"
version = "0.7.0"
description = "librarySync backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "passlib[bcrypt]>=1.7",
  "python-jose[cryptography]>=3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
librarysync = [
  "static/*",
  "static/**/*",
  "templates/*",
  "templates/**/*",
  "db/migrations/*",
  "db/migrations/**/*",
]

[tool.uv]
dev-dependencies = ["ruff>=0.5.0"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/db/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
