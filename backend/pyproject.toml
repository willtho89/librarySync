[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "librarysync"
version = "0.21.0"
description = "librarySync backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "jinja2>=3.1.6",
  "sqlalchemy>=2.1.3",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.5",
  "python-dotenv>=1.2.4",
  "httpx>=0.28.1",
  "bcrypt>=5.0.0",
  "cryptography>=50.0.2",
  "pyjwt>=2.15.1",
  "greenlet>=3.5.6",
  "parsett>=1.8.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
librarysync = [
  "static/*",
  "static/**/*",
  "templates/*",
  "templates/**/*",
  "db/migrations/*",
  "db/migrations/**/*",
]

[dependency-groups]
dev = ["ruff>=0.16.10", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "aiosqlite>=0.22.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `librarysync` importable from src/ without per-test sys.path tweaks.
pythonpath = ["src"]
# Async tests and fixtures are marked explicitly (pytest.mark.asyncio / pytest_asyncio.fixture).
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  # Starlette's TestClient asks for httpx2; drop once the dev dependencies switch to it.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
