[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "librarysync"
version = "0.19.1"
description = "librarySync backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.133.1",
  "uvicorn[standard]>=0.44.0",
  "jinja2>=3.1.6",
  "sqlalchemy>=2.0.49",
  "alembic>=1.18.4",
  "psycopg[binary]>=3.3.3",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.2",
  "httpx>=0.28.1",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.5.0",
  "greenlet>=3.4.0",
  "parsett>=1.8.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
librarysync = [
  "static/*",
  "static/**/*",
  "templates/*",
  "templates/**/*",
  "db/migrations/*",
  "db/migrations/**/*",
]

[dependency-groups]
dev = ["ruff>=0.15.3", "pytest>=9.0.3", "pytest-asyncio>=0.23.0", "aiosqlite>=0.20.0"]
