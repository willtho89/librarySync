[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "librarysync"
version = "0.20.1"
description = "librarySync backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "jinja2>=3.1.6",
  "sqlalchemy>=2.1.2",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.5",
  "python-dotenv>=1.2.4",
  "httpx>=0.28.1",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.5.0",
  "greenlet>=3.5.6",
  "parsett>=1.8.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
librarysync = [
  "static/*",
  "static/**/*",
  "templates/*",
  "templates/**/*",
  "db/migrations/*",
  "db/migrations/**/*",
]

[dependency-groups]
dev = ["ruff>=0.16.10", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "aiosqlite>=0.22.1"]
